<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="212 212 600 600">
  <defs>
    <!-- 
      Gradient 1: "Deep Water" (Outer Shell)
      Adjusted to flow vertically through the new compact frame.
    -->
    <linearGradient id="water-gradient" x1="512" y1="810" x2="512" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#005BEA" />
      <stop offset="100%" stop-color="#00C6FB" />
    </linearGradient>

    <!-- 
      Gradient 2: "Organic Growth" (Inner Core)
      Flows from deep teal at the roots to lime green at the top.
    -->
    <linearGradient id="growth-gradient" x1="510" y1="750" x2="510" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0ba360" />
      <stop offset="50%" stop-color="#3cba92" />
      <stop offset="100%" stop-color="#a8eb12" />
    </linearGradient>

    <!-- Top Bracket Shape Definition -->
    <path id="top-bracket" d="M295 320 h45 q35 0 35 35 v70 q0 35 -35 35 h-45" />

    <!-- Bottom Loop Shape Definition -->
    <path id="bottom-loop" d="M295 650 V564 a40 40 0 0 1 80 0 v100 a40 40 0 0 1 -40 40 h-40" />
    
    <!-- Soft Glow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card: Adjusted to fill the new ViewBox with rounded corners -->
  <rect x="212" y="212" width="600" height="600" rx="100" fill="#1a1c23" />

  <!-- Main Content Group -->
  <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
    
    <!-- Outer Shell: Water Aspect -->
    <g stroke="url(#water-gradient)">
      <!-- Left Side -->
      <use href="#top-bracket" />
      <use href="#bottom-loop" />
      
      <!-- Right Side (Mirrored) -->
      <g transform="translate(1024, 0) scale(-1, 1)">
        <use href="#top-bracket" />
        <use href="#bottom-loop" />
      </g>
    </g>

    <!-- Center Parts: Growing Aspect (Centered at x=510 visually) -->
    <g stroke="url(#growth-gradient)">
      <path d="M465 320 v140" />
      <path d="M555 564 v140" />
      <!-- The central growing vine -->
      <path d="M555 320 v140 c0 52 -90 52 -90 104 v140" />
    </g>
    
  </g>
</svg>