name: Build

on:
  push:
    branches: [main, trunk]
  pull_request:
    branches: [main, trunk]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache Elixir deps
        uses: actions/cache@v4
        with:
          path: |
            app/deps
            app/_build
          key: elixir-${{ runner.os }}-${{ hashFiles('app/mix.lock') }}

      - name: Build
        run: make build

      - name: Package
        run: make package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iterate-live-macos
          path: dist/*.dmg
